<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Nexus Viewer | Premium Study Suite</title>
    
    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Dark Theme (Default) */
            --bg-main: #0f172a;
            --bg-sidebar: rgba(30, 41, 59, 0.7);
            --bg-card: rgba(51, 65, 85, 0.4);
            --accent-primary: #38bdf8;
            --accent-secondary: #8b5cf6;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(15, 23, 42, 0.8);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        [data-theme="light"] {
            --bg-main: #f8fafc;
            --bg-sidebar: rgba(241, 245, 249, 0.8);
            --bg-card: rgba(255, 255, 255, 0.6);
            --accent-primary: #0284c7;
            --accent-secondary: #7c3aed;
            --text-main: #0f172a;
            --text-dim: #475569;
            --border-color: rgba(0, 0, 0, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.8);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-primary) transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease;
        }

        /* --- Layout Components --- */

        header {
            height: 64px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.25rem;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        main {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* --- Sidebar --- */
        #sidebar {
            width: 300px;
            background: var(--bg-sidebar);
            backdrop-filter: blur(8px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #sidebar.collapsed {
            transform: translateX(-300px);
            width: 0;
        }

        .sidebar-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.85rem;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--accent-primary);
            border-bottom-color: var(--accent-primary);
            background: rgba(56, 189, 248, 0.05);
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        /* --- Viewer Area --- */
        #viewer-container {
            flex: 1;
            position: relative;
            overflow: auto;
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .pdf-page-wrapper {
            position: relative;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            background: white;
            line-height: 0;
        }

        canvas.pdf-canvas {
            max-width: 100%;
            height: auto !important;
        }

        .drawing-layer {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 5;
        }

        .drawing-layer.active {
            pointer-events: all;
            cursor: crosshair;
        }

        #video-player {
            width: 90%;
            max-width: 1000px;
            border-radius: 12px;
            display: none;
            box-shadow: var(--shadow);
        }

        /* --- Tools UI --- */
        .floating-toolbar {
            position: fixed;
            top: 80px;
            right: 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 90;
            box-shadow: var(--shadow);
        }

        .tool-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: var(--accent-primary);
            color: white;
        }

        .tool-btn.active {
            background: var(--accent-secondary);
            color: white;
        }

        /* --- Search & Interaction --- */
        .search-bar {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 4px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-bar input {
            background: none;
            border: none;
            color: var(--text-main);
            outline: none;
            width: 150px;
        }

        /* --- Lock & Solve Styling --- */
        #selection-overlay {
            position: absolute;
            border: 2px dashed var(--accent-primary);
            background: rgba(56, 189, 248, 0.1);
            pointer-events: none;
            display: none;
            z-index: 20;
        }

        .locked-zone {
            position: absolute;
            border: 2px solid var(--accent-secondary);
            background: transparent;
            pointer-events: none;
            z-index: 15;
        }

        /* --- Bottom Bar --- */
        .bottom-bar {
            height: 48px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 0 24px;
        }

        .page-nav {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="number"] {
            width: 50px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            text-align: center;
            border-radius: 4px;
        }

        /* --- Notes & Bookmarks --- */
        .note-item {
            background: var(--bg-card);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        textarea#note-input {
            width: 100%;
            height: 100px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            padding: 8px;
            resize: none;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        /* Dropdown/Context Menu */
        .color-picker {
            display: flex;
            gap: 5px;
            padding: 5px;
        }

        .color-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-dot.active { border-color: white; }

        /* Transitions */
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #drop-zone {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(56, 189, 248, 0.2);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            border: 4px dashed var(--accent-primary);
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div id="drop-zone"><h1>Drop PDF or Video Here</h1></div>

    <header>
        <div class="brand">
            <i data-lucide="layers"></i>
            <span>PDF NEXUS</span>
        </div>

        <div class="nav-controls">
            <div class="search-bar">
                <i data-lucide="search" size="18"></i>
                <input type="text" id="pdf-search" placeholder="Search text...">
            </div>

            <button class="tool-btn" onclick="document.getElementById('file-input').click()" title="Open File">
                <i data-lucide="folder-open"></i>
            </button>
            <input type="file" id="file-input" hidden accept=".pdf,video/*">

            <div style="width: 1px; height: 24px; background: var(--border-color)"></div>

            <button class="tool-btn" id="view-mode-toggle" title="Switch Mode (PDF/Video)">
                <i data-lucide="file-text"></i>
            </button>

            <div class="zoom-controls">
                <button class="tool-btn" onclick="viewer.zoomOut()"><i data-lucide="minus"></i></button>
                <span id="zoom-level" style="min-width: 45px; text-align: center; font-size: 0.9rem">100%</span>
                <button class="tool-btn" onclick="viewer.zoomIn()"><i data-lucide="plus"></i></button>
            </div>

            <button class="tool-btn" id="theme-toggle">
                <i data-lucide="moon"></i>
            </button>
        </div>
    </header>

    <main>
        <aside id="sidebar">
            <div class="sidebar-tabs">
                <button class="tab-btn active" onclick="switchTab('thumbnails')">Pages</button>
                <button class="tab-btn" onclick="switchTab('bookmarks')">Bookmarks</button>
                <button class="tab-btn" onclick="switchTab('notes')">Study Notes</button>
            </div>
            
            <div id="thumbnails-panel" class="sidebar-content">
                <p style="color: var(--text-dim); text-align: center;">No document loaded</p>
            </div>

            <div id="bookmarks-panel" class="sidebar-content" style="display: none;">
                <button class="btn-primary" onclick="viewer.addBookmark()" style="width:100%; margin-bottom:15px;">Add Bookmark</button>
                <div id="bookmarks-list"></div>
            </div>

            <div id="notes-panel" class="sidebar-content" style="display: none;">
                <textarea id="note-input" placeholder="Type a note for this page..."></textarea>
                <button class="btn-primary" onclick="viewer.saveNote()" style="width:100%">Save Note</button>
                <div id="notes-list" style="margin-top: 20px;"></div>
            </div>
        </aside>

        <div id="viewer-container">
            <!-- PDF Canvas will be injected here -->
            <video id="video-player" controls></video>
            
            <div id="selection-overlay"></div>
            
            <div id="welcome-screen" class="fade-in" style="margin-top: 100px; text-align: center;">
                <i data-lucide="file-up" size="64" style="color: var(--accent-primary); margin-bottom: 20px;"></i>
                <h2>Welcome to Nexus</h2>
                <p style="color: var(--text-dim); margin-top: 10px;">Drag & drop a PDF or Video to start studying</p>
            </div>
        </div>

        <div class="floating-toolbar">
            <button class="tool-btn" id="btn-lock-mode" title="Lock & Solve Mode (Drag to select area)">
                <i data-lucide="focus"></i>
            </button>
            <button class="tool-btn" id="btn-draw-mode" title="Pen Tool">
                <i data-lucide="pen-tool"></i>
            </button>
            <button class="tool-btn" id="btn-eraser" title="Eraser">
                <i data-lucide="eraser"></i>
            </button>
            <div class="color-picker">
                <div class="color-dot active" style="background: #38bdf8" data-color="#38bdf8"></div>
                <div class="color-dot" style="background: #ef4444" data-color="#ef4444"></div>
                <div class="color-dot" style="background: #10b981" data-color="#10b981"></div>
            </div>
            <div style="width: 100%; height: 1px; background: var(--border-color)"></div>
            <button class="tool-btn" onclick="viewer.screenshot()" title="Take Screenshot">
                <i data-lucide="camera"></i>
            </button>
            <button class="tool-btn" onclick="viewer.speakSelectedText()" title="Read Selection (TTS)">
                <i data-lucide="volume-2"></i>
            </button>
            <button class="tool-btn" onclick="viewer.toggleFullscreen()" title="Fullscreen">
                <i data-lucide="maximize"></i>
            </button>
        </div>
    </main>

    <div class="bottom-bar">
        <button class="tool-btn" onclick="viewer.toggleSidebar()" title="Toggle Sidebar">
            <i data-lucide="sidebar"></i>
        </button>
        
        <div class="page-nav">
            <button class="tool-btn" onclick="viewer.prevPage()"><i data-lucide="chevron-left"></i></button>
            <input type="number" id="page-num" value="0">
            <span style="color: var(--text-dim)">/</span>
            <span id="page-count" style="color: var(--text-dim)">0</span>
            <button class="tool-btn" onclick="viewer.nextPage()"><i data-lucide="chevron-right"></i></button>
        </div>

        <div id="status-info" style="font-size: 0.8rem; color: var(--text-dim); position: absolute; right: 24px;">
            Ready
        </div>
    </div>

    <script>
        // --- Initialization & Config ---
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        lucide.createIcons();

        // --- App State Management ---
        const state = {
            pdf: null,
            pageNum: 1,
            numPages: 0,
            zoom: 1.0,
            mode: 'pdf', // pdf or video
            isDark: true,
            bookmarks: [],
            notes: {}, // { page: note }
            studyMode: {
                active: false,
                selecting: false,
                locked: false,
                rect: null, // {x, y, w, h}
                drawMode: false,
                paths: [], // Drawing data
                currentColor: '#38bdf8',
                isEraser: false
            }
        };

        // --- PDF Viewer Engine ---
        const viewer = {
            async loadFile(file) {
                const url = URL.createObjectURL(file);
                if (file.type === 'application/pdf') {
                    this.switchMode('pdf');
                    state.pdf = await pdfjsLib.getDocument(url).promise;
                    state.numPages = state.pdf.numPages;
                    state.pageNum = parseInt(localStorage.getItem(`last-page-${file.name}`)) || 1;
                    document.getElementById('page-count').textContent = state.numPages;
                    document.getElementById('welcome-screen').style.display = 'none';
                    this.renderPage(state.pageNum);
                    this.renderThumbnails();
                    this.loadStoredData(file.name);
                } else if (file.type.startsWith('video/')) {
                    this.switchMode('video');
                    const video = document.getElementById('video-player');
                    video.src = url;
                    video.style.display = 'block';
                    document.getElementById('welcome-screen').style.display = 'none';
                }
            },

            async renderPage(num) {
                state.pageNum = num;
                const page = await state.pdf.getPage(num);
                const viewport = page.getViewport({ scale: state.zoom });

                const container = document.getElementById('viewer-container');
                container.innerHTML = ''; // Single page view for better focus
                
                const wrapper = document.createElement('div');
                wrapper.className = 'pdf-page-wrapper fade-in';
                wrapper.id = `page-wrapper-${num}`;
                
                const canvas = document.createElement('canvas');
                canvas.className = 'pdf-canvas';
                const ctx = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderCtx = { canvasContext: ctx, viewport: viewport };
                await page.render(renderCtx).promise;

                // Create Drawing Layer Overlay
                const drawCanvas = document.createElement('canvas');
                drawCanvas.className = 'drawing-layer';
                drawCanvas.width = viewport.width;
                drawCanvas.height = viewport.height;
                drawCanvas.id = 'active-draw-canvas';

                wrapper.appendChild(canvas);
                wrapper.appendChild(drawCanvas);
                container.appendChild(wrapper);

                document.getElementById('page-num').value = num;
                this.updateUIStatus();
                this.initDrawingEvents(drawCanvas);
                this.redrawSavedPaths(drawCanvas);
                
                // Save last page
                localStorage.setItem(`last-page-current`, num);
            },

            async renderThumbnails() {
                const thumbContainer = document.getElementById('thumbnails-panel');
                thumbContainer.innerHTML = '';
                for (let i = 1; i <= state.numPages; i++) {
                    const thumb = document.createElement('div');
                    thumb.style.cssText = 'padding: 10px; cursor: pointer; border-bottom: 1px solid var(--border-color); font-size: 0.8rem;';
                    thumb.innerHTML = `Page ${i}`;
                    thumb.onclick = () => this.renderPage(i);
                    thumbContainer.appendChild(thumb);
                }
            },

            switchMode(mode) {
                state.mode = mode;
                const video = document.getElementById('video-player');
                const btn = document.getElementById('view-mode-toggle');
                if (mode === 'pdf') {
                    video.style.display = 'none';
                    btn.innerHTML = '<i data-lucide="file-text"></i>';
                } else {
                    video.style.display = 'block';
                    btn.innerHTML = '<i data-lucide="video"></i>';
                    document.getElementById('viewer-container').innerHTML = '';
                    document.getElementById('viewer-container').appendChild(video);
                }
                lucide.createIcons();
            },

            zoomIn() { state.zoom += 0.2; this.renderPage(state.pageNum); this.updateZoomLabel(); },
            zoomOut() { if (state.zoom > 0.4) state.zoom -= 0.2; this.renderPage(state.pageNum); this.updateZoomLabel(); },
            updateZoomLabel() { document.getElementById('zoom-level').textContent = Math.round(state.zoom * 100) + '%'; },

            nextPage() { if (state.pageNum < state.numPages) this.renderPage(state.pageNum + 1); },
            prevPage() { if (state.pageNum > 1) this.renderPage(state.pageNum - 1); },

            toggleSidebar() {
                document.getElementById('sidebar').classList.toggle('collapsed');
            },

            // --- Drawing & Study Mode ---
            initDrawingEvents(canvas) {
                const ctx = canvas.getContext('2d');
                let isDrawing = false;

                canvas.onmousedown = (e) => {
                    if (!state.studyMode.drawMode) return;
                    
                    // Logic for locked area
                    if (state.studyMode.locked) {
                        const rect = state.studyMode.rect;
                        const bx = e.offsetX, by = e.offsetY;
                        if (bx < rect.x || bx > rect.x + rect.w || by < rect.y || by > rect.y + rect.h) return;
                    }

                    isDrawing = true;
                    ctx.beginPath();
                    ctx.moveTo(e.offsetX, e.offsetY);
                    
                    // Start path data
                    state.studyMode.paths.push({
                        type: 'start',
                        x: e.offsetX,
                        y: e.offsetY,
                        color: state.studyMode.isEraser ? null : state.studyMode.currentColor,
                        isEraser: state.studyMode.isEraser,
                        page: state.pageNum
                    });
                };

                canvas.onmousemove = (e) => {
                    if (!isDrawing) return;
                    
                    ctx.lineWidth = state.studyMode.isEraser ? 20 : 3;
                    ctx.lineCap = 'round';
                    ctx.strokeStyle = state.studyMode.isEraser ? '#ffffff' : state.studyMode.currentColor;
                    
                    if (state.studyMode.isEraser) ctx.globalCompositeOperation = 'destination-out';
                    else ctx.globalCompositeOperation = 'source-over';

                    // Clipping if locked
                    if (state.studyMode.locked) {
                        ctx.save();
                        const r = state.studyMode.rect;
                        ctx.beginPath();
                        ctx.rect(r.x, r.y, r.w, r.h);
                        ctx.clip();
                    }

                    ctx.lineTo(e.offsetX, e.offsetY);
                    ctx.stroke();
                    
                    if (state.studyMode.locked) ctx.restore();

                    state.studyMode.paths.push({
                        type: 'move',
                        x: e.offsetX,
                        y: e.offsetY,
                        page: state.pageNum
                    });
                };

                canvas.onmouseup = () => {
                    isDrawing = false;
                    this.saveLocalData();
                };
            },

            redrawSavedPaths(canvas) {
                const ctx = canvas.getContext('2d');
                state.studyMode.paths.forEach(p => {
                    if (p.page !== state.pageNum) return;
                    if (p.type === 'start') {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.strokeStyle = p.isEraser ? '#ffffff' : p.color;
                        ctx.globalCompositeOperation = p.isEraser ? 'destination-out' : 'source-over';
                        ctx.lineWidth = p.isEraser ? 20 : 3;
                    } else {
                        ctx.lineTo(p.x, p.y);
                        ctx.stroke();
                    }
                });
            },

            // --- Features ---
            screenshot() {
                const canvas = document.querySelector('.pdf-canvas');
                if (!canvas) return;
                
                // Combine PDF + Drawing for screenshot
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tCtx = tempCanvas.getContext('2d');
                tCtx.drawImage(canvas, 0, 0);
                const drawCanvas = document.getElementById('active-draw-canvas');
                if (drawCanvas) tCtx.drawImage(drawCanvas, 0, 0);
                
                const link = document.createElement('a');
                link.download = `nexus-shot-p${state.pageNum}.png`;
                link.href = tempCanvas.toDataURL();
                link.click();
            },

            speakSelectedText() {
                const text = window.getSelection().toString();
                if (!text) {
                    alert("Please select some text first.");
                    return;
                }
                const utterance = new SpeechSynthesisUtterance(text);
                speechSynthesis.speak(utterance);
            },

            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            },

            addBookmark() {
                const name = `Page ${state.pageNum} - ${new Date().toLocaleTimeString()}`;
                state.bookmarks.push({ page: state.pageNum, name });
                this.updateBookmarksUI();
                this.saveLocalData();
            },

            updateBookmarksUI() {
                const list = document.getElementById('bookmarks-list');
                list.innerHTML = state.bookmarks.map((b, i) => `
                    <div class="note-item" onclick="viewer.renderPage(${b.page})" style="cursor:pointer">
                        <strong>${b.name}</strong>
                    </div>
                `).join('');
            },

            saveNote() {
                const val = document.getElementById('note-input').value;
                if (!val) return;
                if (!state.notes[state.pageNum]) state.notes[state.pageNum] = [];
                state.notes[state.pageNum].push(val);
                document.getElementById('note-input').value = '';
                this.updateNotesUI();
                this.saveLocalData();
            },

            updateNotesUI() {
                const list = document.getElementById('notes-list');
                const pageNotes = state.notes[state.pageNum] || [];
                list.innerHTML = pageNotes.map(n => `<div class="note-item">${n}</div>`).join('');
            },

            updateUIStatus() {
                document.getElementById('status-info').textContent = `Viewing Page ${state.pageNum} of ${state.numPages}`;
                this.updateNotesUI();
            },

            saveLocalData() {
                localStorage.setItem('nexus-bookmarks', JSON.stringify(state.bookmarks));
                localStorage.setItem('nexus-notes', JSON.stringify(state.notes));
                localStorage.setItem('nexus-paths', JSON.stringify(state.studyMode.paths));
            },

            loadStoredData() {
                state.bookmarks = JSON.parse(localStorage.getItem('nexus-bookmarks')) || [];
                state.notes = JSON.parse(localStorage.getItem('nexus-notes')) || {};
                state.studyMode.paths = JSON.parse(localStorage.getItem('nexus-paths')) || [];
                this.updateBookmarksUI();
            }
        };

        // --- Event Listeners & UI Logic ---

        // File Input
        document.getElementById('file-input').onchange = (e) => {
            if (e.target.files[0]) viewer.loadFile(e.target.files[0]);
        };

        // Drag & Drop
        window.addEventListener('dragover', (e) => {
            e.preventDefault();
            document.getElementById('drop-zone').style.display = 'flex';
        });
        window.addEventListener('dragleave', () => {
            document.getElementById('drop-zone').style.display = 'none';
        });
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            document.getElementById('drop-zone').style.display = 'none';
            if (e.dataTransfer.files[0]) viewer.loadFile(e.dataTransfer.files[0]);
        });

        // Theme Toggle
        document.getElementById('theme-toggle').onclick = () => {
            state.isDark = !state.isDark;
            document.documentElement.setAttribute('data-theme', state.isDark ? 'dark' : 'light');
            document.getElementById('theme-toggle').innerHTML = state.isDark ? '<i data-lucide="moon"></i>' : '<i data-lucide="sun"></i>';
            lucide.createIcons();
        };

        // Tab Switching
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.sidebar-content').forEach(p => p.style.display = 'none');
            event.target.classList.add('active');
            document.getElementById(`${tab}-panel`).style.display = 'block';
        }

        // Color Picker
        document.querySelectorAll('.color-dot').forEach(dot => {
            dot.onclick = () => {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                state.studyMode.currentColor = dot.dataset.color;
                state.studyMode.isEraser = false;
            };
        });

        // Mode Toggles
        document.getElementById('btn-draw-mode').onclick = () => {
            state.studyMode.drawMode = !state.studyMode.drawMode;
            document.getElementById('btn-draw-mode').classList.toggle('active');
            const layer = document.querySelector('.drawing-layer');
            if (layer) layer.classList.toggle('active');
        };

        document.getElementById('btn-eraser').onclick = () => {
            state.studyMode.isEraser = !state.studyMode.isEraser;
            document.getElementById('btn-eraser').classList.toggle('active');
        };

        // Lock & Solve Logic
        document.getElementById('btn-lock-mode').onclick = () => {
            state.studyMode.active = !state.studyMode.active;
            const btn = document.getElementById('btn-lock-mode');
            btn.classList.toggle('active');
            
            if (state.studyMode.active) {
                document.getElementById('viewer-container').style.cursor = 'crosshair';
                alert("Drag a rectangle over the PDF to lock the study area.");
            } else {
                state.studyMode.locked = false;
                document.getElementById('selection-overlay').style.display = 'none';
                document.getElementById('viewer-container').style.cursor = 'default';
            }
        };

        // Selection Rectangle Logic
        const viewerCont = document.getElementById('viewer-container');
        let startX, startY;

        viewerCont.onmousedown = (e) => {
            if (!state.studyMode.active || state.studyMode.locked) return;
            state.studyMode.selecting = true;
            startX = e.pageX + viewerCont.scrollLeft;
            startY = e.pageY + viewerCont.scrollTop;
            
            const overlay = document.getElementById('selection-overlay');
            overlay.style.left = startX + 'px';
            overlay.style.top = startY + 'px';
            overlay.style.width = '0px';
            overlay.style.height = '0px';
            overlay.style.display = 'block';
        };

        viewerCont.onmousemove = (e) => {
            if (!state.studyMode.selecting) return;
            const overlay = document.getElementById('selection-overlay');
            const currentX = e.pageX + viewerCont.scrollLeft;
            const currentY = e.pageY + viewerCont.scrollTop;
            
            const width = currentX - startX;
            const height = currentY - startY;
            
            overlay.style.width = Math.abs(width) + 'px';
            overlay.style.height = Math.abs(height) + 'px';
            overlay.style.left = (width > 0 ? startX : currentX) + 'px';
            overlay.style.top = (height > 0 ? startY : currentY) + 'px';
        };

        viewerCont.onmouseup = (e) => {
            if (!state.studyMode.selecting) return;
            state.studyMode.selecting = false;
            state.studyMode.locked = true;
            
            // Convert global overlay coords to local page canvas coords
            const overlay = document.getElementById('selection-overlay');
            const wrapper = document.querySelector('.pdf-page-wrapper');
            const wRect = wrapper.getBoundingClientRect();
            const oRect = overlay.getBoundingClientRect();

            state.studyMode.rect = {
                x: oRect.left - wRect.left,
                y: oRect.top - wRect.top,
                w: oRect.width,
                h: oRect.height
            };

            alert("Area Locked! Drawing is now restricted to this box.");
        };

        // Text Search
        document.getElementById('pdf-search').oninput = async (e) => {
            const query = e.target.value.toLowerCase();
            if (query.length < 3) return;

            // Simple search: iterate pages
            for (let i = 1; i <= state.numPages; i++) {
                const page = await state.pdf.getPage(i);
                const textContent = await page.getTextContent();
                const text = textContent.items.map(item => item.str).join(' ');
                if (text.toLowerCase().includes(query)) {
                    viewer.renderPage(i);
                    document.getElementById('status-info').textContent = `Match found on page ${i}`;
                    break;
                }
            }
        };

        // Hotkeys
        window.onkeydown = (e) => {
            if (e.key === 'ArrowRight') viewer.nextPage();
            if (e.key === 'ArrowLeft') viewer.prevPage();
        };

    </script>
</body>
</html>
